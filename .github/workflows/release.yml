name: Build Node.mgo installers

on:
  push:
    branches: ["bootstrap/runtime-structure"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: node-mgo-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --name node_mgo --paths vendor/memingo --collect-all memingo packaging/entrypoint.py
      - name: Smoke-test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\node_mgo.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\node_mgo.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = & .\dist\node_mgo.exe examples/hello.mgo
          if ($LASTEXITCODE -ne 0 -or $output -notmatch 'Hello from Node.mgo') { throw 'Packaged Memingo example failed.' }
      - name: Smoke-test executable (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/node_mgo --version
          ./dist/node_mgo --help
          test "$(./dist/node_mgo examples/hello.mgo)" = "Hello from Node.mgo"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging/windows/node-mgo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'].replace('.dev0',''))")
          mkdir -p pkgroot/usr/local/bin pkgroot/usr/local/share/doc/node-mgo
          cp dist/node_mgo pkgroot/usr/local/bin/node_mgo
          cp LICENSE pkgroot/usr/local/share/doc/node-mgo/LICENSE
          cp vendor/memingo/LICENSE pkgroot/usr/local/share/doc/node-mgo/Memingo-BSD-3-Clause.txt
          chmod 755 pkgroot/usr/local/bin/node_mgo
          pkgbuild --root pkgroot --identifier dev.atdev.node-mgo --version "$VERSION" --install-location / dist/Node.mgo-macOS-arm64.pkg
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'].replace('.dev0',''))")
          mkdir -p dist/node-mgo-linux-x64/licenses
          cp dist/node_mgo dist/node-mgo-linux-x64/node_mgo
          cp LICENSE dist/node-mgo-linux-x64/licenses/GPL-3.0.txt
          cp vendor/memingo/LICENSE dist/node-mgo-linux-x64/licenses/Memingo-BSD-3-Clause.txt
          chmod 755 dist/node-mgo-linux-x64/node_mgo
          tar -C dist -czf dist/Node.mgo-Linux-x64.tar.gz node-mgo-linux-x64
          mkdir -p debroot/usr/bin debroot/DEBIAN debroot/usr/share/doc/node-mgo
          cp dist/node_mgo debroot/usr/bin/node_mgo
          cp LICENSE debroot/usr/share/doc/node-mgo/copyright
          cp vendor/memingo/LICENSE debroot/usr/share/doc/node-mgo/Memingo-BSD-3-Clause.txt
          chmod 755 debroot/usr/bin/node_mgo
          cat > debroot/DEBIAN/control <<EOF
          Package: node-mgo
          Version: ${VERSION}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: Atdev Dev
          Description: Unified Memingo and planned Node.js 24-compatible runtime
           Node.mgo currently bundles the Memingo interpreter and CLI.
          EOF
          dpkg-deb --build debroot "dist/Node.mgo-Linux-amd64.deb"
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: node-mgo-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: node-mgo-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
