name: Node.mgo CI

concurrency:
  group: node-mgo-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Termux installer syntax
        if: runner.os == 'Linux'
        run: bash -n install-termux.sh
      - name: Compile Python sources
        run: python -m compileall -q node_mgo vendor/memingo/memingo
      - name: Run Node.mgo integration tests
        run: python -m unittest discover -s tests -p "test_node_mgo*.py" -v
      - name: Run upstream Memingo regression tests
        env:
          PYTHONPATH: vendor/memingo
        run: python -m unittest discover -s vendor/memingo/tests -v
