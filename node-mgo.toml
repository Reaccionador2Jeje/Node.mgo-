name = "node-mgo"
version = "0.1.0-dev"
description = "Unified Memingo and planned Node.js 24-compatible runtime"
license = "GPL-3.0"

[files]
memingo_extension = ".mgo"
javascript_extensions = [".js", ".mjs", ".cjs"]

[commands]
main = "node-mgo"
memingo = "memingo"
packages = "mgoa"

[compatibility]
nodejs = "24.x LTS"
nodejs_api_reference = "24.22.2"
memingo = "0.2.0"
memingo_source_repository = "Reaccionador2Jeje/Memingo"
memingo_source_commit = "77b6f0a7028bc5b3422c6d5a10e51d7b235639e9"
memingo_compatibility = "vendored upstream runtime; integration tests pending"
javascript_compatibility = "not implemented"

[runtimes]
memingo = "vendored Python 3.10+ runtime"
javascript = "planned Memingo-hosted ECMAScript engine"

[installation]
requires_upstream_nodejs = false
requires_python = true
python_version = ">=3.10"
goal = "simple installer with minimal dependencies"
