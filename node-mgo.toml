name = "node-mgo"
version = "0.1.0-dev"
description = "A Node.js 24-compatible runtime preserving the Memingo ecosystem"
license = "GPL-3.0"

[files]
memingo_extension = ".mgo"
javascript_extension = ".js"

[commands]
main = "node-mgo"

[compatibility]
nodejs = "24.x LTS"
nodejs_api_reference = "24.22.2"
memingo = "0.2"
memingo_source_repository = "Reaccionador2Jeje/Memingo"
memingo_source_commit = "77b6f0a7028bc5b3422c6d5a10e51d7b235639e9"
memingo_compatibility = "full ecosystem preservation"

[runtimes]
memingo = "native"
javascript = "planned-memingo-interpreter"

[installation]
requires_upstream_nodejs = false
goal = "simple installer with minimal dependencies"
