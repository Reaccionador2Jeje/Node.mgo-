[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memingo-lang"
version = "0.2.0"
description = "Memingo, a meme-inspired programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "AtDev"}]

[project.scripts]
memingo = "memingo.__main__:main"
mgoa = "memingo.mgoa_cli:main"

[tool.setuptools.packages.find]
include = ["memingo*"]
